  timeout: ${EXPEDIA_TIMEOUT:30000}

booking:
  com:
    api:
      key: ${BOOKING_COM_API_KEY:}
    partner:
      id: ${BOOKING_COM_PARTNER_ID:}
  timeout: ${BOOKING_COM_TIMEOUT:30000}

email:
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${EMAIL_FROM:noreply@example.com}
    from-name: ${EMAIL_FROM_NAME:Agentic Itinerary Planner}

pdf:
  base-url: ${PDF_BASE_URL:http://localhost:8080}
  template-path: ${PDF_TEMPLATE_PATH:classpath:/templates/pdf/}



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: ${PROMETHEUS_ENABLED:false}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.tripplanner: ${APP_LOG_LEVEL:INFO}
    com.tripplanner.service: INFO
    com.tripplanner.data: INFO
    com.tripplanner.service.agents: INFO
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.springframework.web: DEBUG
    com.google.cloud: ${GCP_LOG_LEVEL:INFO}
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.web.filter.CorsFilter: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ${LOG_FILE:logs/application.log}



app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  max-itinerary-days: ${MAX_ITINERARY_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,

# Analytics Configuration (GCP Pub/Sub → BigQuery)
analytics:
  enabled: ${ANALYTICS_ENABLED:true}
  pubsub:
    topic: ${ANALYTICS_PUBSUB_TOPIC:analytics-events}
  bigquery:
    dataset: ${ANALYTICS_BIGQUERY_DATASET:analytics}
    table: ${ANALYTICS_BIGQUERY_TABLE:raw_events}
  monitoring:
    # Cloud Monitoring disabled by default (native library issues in some environments)
    enabled: ${ANALYTICS_MONITORING_ENABLED:false}

# Itinerary Generation Pipeline Configuration
itinerary:
  # Pipeline mode is now the only generation mode
  # Monolithic mode removed in migration (2025-10-18)
  generation:
    pipeline:
      # Enable parallel execution for population phase (ActivityAgent, MealAgent, TransportAgent)
      # NOTE: Currently runs sequentially with locks to prevent concurrent modifications
      # TODO: Implement true parallel execution with CompletableFuture.allOf()
      parallel: ${PIPELINE_PARALLEL:true}
      
      # OPTIMIZATION: City-grouped parallel skeleton generation (IMPLEMENTED & ENABLED)
      # parallel-cities: true = Generate different cities in parallel (skeleton: 74s → ~29s)
      #   - Days in same city remain sequential (preserves context)
      #   - Different cities run in parallel
      #   - Uses collect-then-save pattern
      # parallel-cities: false = Sequential skeleton generation (LEGACY)
      parallel-cities: ${PIPELINE_PARALLEL_CITIES:true}
      
      # Enrichment mode configuration
      enrichment:
        # OPTIMIZATION: Full parallel enrichment (Phase 1)
        # full-parallel: true = Enrich ALL days simultaneously (FASTEST - 92s → 18s)
        #   - Uses collect-then-save pattern (no lock contention)
        #   - Maximum parallelization
        #   - Recommended for production after testing
        # full-parallel: false = Use batched or sequential mode (LEGACY)
        full-parallel: ${PIPELINE_ENRICHMENT_FULL_PARALLEL:true}
        
        # Enable batched parallel enrichment vs sequential (one-by-one)
        # BATCHED PARALLEL (parallel: true): Enriches N days at a time (balanced approach)
        #   - Example: 8-day trip with batch-size 3 → enriches 3+3+2 days
        #   - Faster than sequential, safer than full parallel
        # SEQUENTIAL (parallel: false): Enriches one day at a time (safest)
        #   - Slowest but completely avoids rate limits
        # NOTE: Ignored when full-parallel is true
        parallel: ${PIPELINE_ENRICHMENT_PARALLEL:true}
        
        # Batch size for parallel enrichment (how many days to enrich simultaneously)
        # batch-size: 1 = Sequential (safest, slowest)
        # batch-size: 2-3 = Batched parallel (balanced - RECOMMENDED)
        # batch-size: 4+ = Aggressive parallel (faster but may hit rate limits)
        # Race condition fix implemented via collect-then-save pattern
        # NOTE: Ignored when full-parallel is true
        batch-size: ${PIPELINE_ENRICHMENT_BATCH_SIZE:3}
        
        # Maximum retry attempts for failed days
        # If a day fails to enrich, it will be retried up to this many times
        # Recommended: 2 (gives 3 total attempts: initial + 2 retries)
        max-retries: ${PIPELINE_ENRICHMENT_MAX_RETRIES:2}
        
        # Timeout for entire enrichment phase
        timeout-ms: ${PIPELINE_ENRICHMENT_TIMEOUT_MS:90000}
        
        # Timeout per batch (parallel mode) or per day (sequential mode)
        per-batch-timeout-ms: ${PIPELINE_ENRICHMENT_PER_BATCH_TIMEOUT_MS:45000}
      
      # Phase timeouts
      city-allocation:
        timeout-ms: ${PIPELINE_CITY_ALLOCATION_TIMEOUT_MS:30000}
      
      skeleton:
        timeout-ms: ${PIPELINE_SKELETON_TIMEOUT_MS:120000}
        batch-size: ${ITINERARY_SKELETON_BATCH_SIZE:1}
        # City-grouped parallel skeleton generation (ENABLED)
        parallel-cities: ${PIPELINE_SKELETON_PARALLEL_CITIES:true}  # Enable city-grouped parallel generation
        batch-size-per-city: ${PIPELINE_SKELETON_BATCH_SIZE_PER_CITY:1}  # Days per LLM call within same city
        max-parallel-cities: ${PIPELINE_SKELETON_MAX_PARALLEL_CITIES:2}  # Max city groups in parallel (2 for free tier)
        fallback-sequential: ${PIPELINE_SKELETON_FALLBACK_SEQUENTIAL:true}  # Fallback to sequential on error
      
      population:
        timeout-ms: ${PIPELINE_POPULATION_TIMEOUT_MS:180000}
      
      finalization:
        timeout-ms: ${PIPELINE_FINALIZATION_TIMEOUT_MS:30000}
      
      # Validation hook (extensibility for future ItineraryValidator)
      validation:
        enabled: ${PIPELINE_VALIDATION_ENABLED:false}
  
  # General itinerary settings
  max-party-size: ${MAX_PARTY_SIZE:20}
  default-language: ${DEFAULT_LANGUAGE:en}
  supported-languages: ${SUPPORTED_LANGUAGES:en,es,fr,de,it,pt,ja,ko,zh}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:100}
    burst-capacity: ${RATE_LIMIT_BURST:200}
  cache:
    ttl-minutes: ${CACHE_TTL_MINUTES:60}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

# Enrichment Configuration
enrichment:
  auto-enrich:
    enabled: ${ENRICHMENT_AUTO_ENRICH_ENABLED:true}
