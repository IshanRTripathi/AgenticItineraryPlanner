server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: agentic-itinerary-planner
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
  main:
    allow-bean-definition-overriding: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: "*"
  # Remove JPA/H2 completely; exclude autoconfiguration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  # Spring AI MCP Server Configuration
  ai:
    mcp:
      server:
        enabled: false  # Disable Spring AI MCP server autoconfiguration to avoid startup errors
  # Security completely disabled for development
  security:
    user:
      name: disabled
      password: disabled
      roles: DISABLED
  # Spring Cloud GCP Configuration
  cloud:
    gcp:
      project-id: tripaiplanner
      # Use Application Default Credentials (set via gcloud auth application-default login)
      credentials:
        location: ${GOOGLE_APPLICATION_CREDENTIALS:}
      pubsub:
        project-id: tripaiplanner

# Feature Flags for Gradual Rollout
features:
  weather-tools:
    enabled: true  # Set to true to enable weather-aware activity planning
    fallback-on-error: true  # If weather tools fail, fall back to LLM-only approach
    log-comparisons: true  # Log decisions for A/B testing analysis
  
  cost-tools:
    enabled: true  # Set to true to enable Calculate Cost tool with budget analysis
    fallback-on-error: true  # If cost tool fails, fall back to BudgetTracker service
  
  cost-estimation:
    rule-based: true  # Set to true to use fast rule-based cost estimation (< 1s vs 46s with LLM)
  
  meal-tools:
    enabled: true  # Set to true to enable meal tools (Node ID, Constraints, Schema validation)
    fallback-on-error: true  # If tools fail, fall back to existing services
  
  transport-tools:
    enabled: true  # Set to true to enable transport tools (Node ID, Constraints, Distance, Schema)
    fallback-on-error: true  # If tools fail, fall back to existing services
  
  skeleton-tools:
    enabled: true  # Set to true to enable skeleton planner tools (Node ID, Constraints, Schema)
    fallback-on-error: true  # If tools fail, fall back to existing services
  
  enrichment-tools:
    enabled: true  # Set to true to enable enrichment tools (Schema validation for Google Places data)
    fallback-on-error: true  # If tools fail, fall back to existing behavior
  
  explain-tools:
    enabled: true  # Set to true to enable explain tools (Cost calculation for queries)
    fallback-on-error: true  # If tools fail, fall back to existing behavior
  
  booking-tools:
    enabled: true  # Set to true to enable booking tools (Schema validation for booking requests)
    fallback-on-error: true  # If tools fail, fall back to existing behavior
  
  city-allocation-tools:
    enabled: true  # Set to true to enable city allocation tools (Distance, Schema validation)
    fallback-on-error: true  # If tools fail, fall back to existing behavior
  
  day-planner-tools:
    enabled: true  # Set to true to enable day-by-day planner tools (Node ID, Constraints, Conflicts, Timing, Weather, Schema)
    fallback-on-error: true  # If tools fail, fall back to existing behavior
  
  editor-tools:
    enabled: true  # Set to true to enable editor tools (Node ID, Conflicts, Cost, Schema validation)
    fallback-on-error: true  # If tools fail, fall back to existing behavior

# Tool Result Caching Configuration
cache:
  tool-results:
    enabled: true  # Set to true to enable tool result caching (reduces duplicate API calls by 60-80%)

# Memory & Validation System Configuration
memory:
  enabled: true  # Enable memory system for learning user preferences
  async-operations: true  # Use async operations for non-blocking memory storage
  pattern-learning: false  # Enable pattern learning (experimental - set to true when ready)
  confidence-decay:
    enabled: true  # Enable confidence decay over time
    half-life-months: 6  # Confidence decays to 50% after 6 months

validation:
  enabled: true  # Enable validation system
  tools:
    check-completeness:
      enabled: true  # Check for missing meals, activities, transport
      fallback-on-error: true
    check-budget-health:
      enabled: true  # Analyze budget health and spending patterns
      fallback-on-error: true
    check-timing-feasibility:
      enabled: true  # Validate timing and schedule feasibility
      fallback-on-error: true
    check-dietary-compliance:
      enabled: true  # Verify meals comply with dietary restrictions
      fallback-on-error: true
    check-conflicts:
      enabled: true  # Check for time overlaps and conflicts
      fallback-on-error: true
  advisor:
    enabled: false  # Enable ValidationAdvisor agent (set to true after testing)
    skip-group-trips: true  # Skip validation for group trips (memory not supported yet)
    llm-advice: false  # Use LLM for smarter recommendations (set to true when ready)
    default-level: STANDARD  # Default validation level: BASIC, STANDARD, or COMPREHENSIVE
    session:
      max-entries: 100  # Maximum number of itineraries in session cache
    cleanup:
      cron: "0 0 2 * * ?"  # Cleanup schedule (default: 2 AM daily)
    
